services:
  web:
    build: .
    command: sh -c 'python manage.py migrate && python manage.py runserver 0.0.0.0:8000'
    ports:
      - '127.0.0.1:8000:8000'
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-local-development-only}
      DJANGO_DEBUG: '1'
      POSTGRES_HOST: db
      POSTGRES_DB: locations
      POSTGRES_USER: locations
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-locations-local}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: locations
      POSTGRES_USER: locations
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-locations-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U locations -d locations']
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
